<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find funding — NYC Compass</title>

  <!--
    ============================================================================
    NYC Compass — the funding directory (ticket E10-02).

    WHAT THIS PAGE IS FOR
    Maryland's Community Compass leads with "Find Funding": a browsable, filterable list of every
    program it knows about. That page is how a collection of programs becomes something a person can
    survey, rather than something you can only query if you already know what to ask. This is the
    NYC equivalent.

    WHY IT NEEDS NO SERVER
    Everything comes from one static file, `data/programs.json`, generated by
    `scripts/build_web_data.py`. Filtering happens in the browser. At ~100 programs that is instant,
    it can be hosted anywhere that serves files, and there is nothing behind it to be slow or down —
    which matters for a demo, where every moving part is a way to fail in front of someone.

    THE DESIGN LANGUAGE IS NOT NEW
    Colours, type, spacing, and the light/dark handling are lifted from `index.html` so the two
    pages read as one site. Fraunces for display, Public Sans for body — the same pairing the
    existing card uses. Do not introduce a second palette here.

    THE THREE RULES THIS PAGE MUST NOT BREAK
    1. Every program shows its official source link AND the date that source was last checked. A
       program presented without those is an assertion; with them it is a citation.
    2. Status is shown honestly. "Check current status" for `unknown`, never a cheerful "open".
    3. Place-based programs carry the location caveat, because being inside a boundary is not the
       same as qualifying.
    ============================================================================
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Same tokens as index.html. Changing one here means changing it there too. */
    :root {
      --paper: #faf5ec;
      --card: #fffdf8;
      --ink: #182338;
      --ink-soft: #4a5468;
      --line: #e3dccd;
      --accent: #14507d;
      --accent-warm: #c9682a;
      --good: #1f6b3b;
      --warn: #a3341f;
      --shadow: 0 1px 2px rgba(24,35,56,.06), 0 6px 24px rgba(24,35,56,.06);
      --radius: 12px;
      --display: "Fraunces", Georgia, "Times New Roman", serif;
      --body: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #12161f; --card: #1a2030; --ink: #eef1f6; --ink-soft: #aab3c5;
        --line: #2b3345; --accent: #6fb0e6; --accent-warm: #e5934f;
        --good: #6fce93; --warn: #ef9a8c;
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 30px rgba(0,0,0,.35);
      }
    }
    /* Respect a reader who has asked for less movement. */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: var(--body); font-size: 16px; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }
    a { color: var(--accent); }

    /* ---- header ---- */
    .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display);
             font-weight: 700; font-size: 20px; text-decoration: none; color: var(--ink); }
    .mark { width: 26px; height: 26px; flex: none; }
    h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5vw, 46px);
         line-height: 1.05; margin: 20px 0 8px; letter-spacing: -.01em; }
    .lede { color: var(--ink-soft); max-width: 62ch; margin: 0 0 18px; }

    /* The disclaimer. Same text as config.NOT_ADVICE_NOTICE, injected from the data file so the
       page cannot drift from the agreed wording. */
    .banner { display: flex; gap: 10px; align-items: flex-start; background: color-mix(in srgb, var(--accent-warm) 9%, var(--card));
              border: 1px solid color-mix(in srgb, var(--accent-warm) 30%, var(--line));
              border-radius: var(--radius); padding: 12px 14px; font-size: 14px; margin: 0 0 24px; }

    /* ---- filters ---- */
    .filters { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
               padding: 16px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .filter-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
    /* Search gets two columns. It holds the longest placeholder of any field, and at one column
       that text truncated mid-word — which makes the example look like a typo rather than a hint. */
    .field.wide { grid-column: span 2; }
    .field label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em;
                   text-transform: uppercase; color: var(--ink-soft); margin-bottom: 5px; }
    select, input[type="search"] {
      width: 100%; padding: 9px 10px; font: inherit; font-size: 15px; color: var(--ink);
      background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    }
    select:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible {
      outline: 3px solid var(--accent-warm); outline-offset: 2px;
    }
    .filter-actions { display: flex; align-items: center; justify-content: space-between;
                      gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    .count { font-weight: 600; }
    .count .dim { color: var(--ink-soft); font-weight: 400; }
    button.reset { font: inherit; font-size: 14px; padding: 8px 14px; cursor: pointer;
                   background: transparent; color: var(--accent); border: 1px solid var(--line);
                   border-radius: 8px; }

    /* ---- program cards ---- */
    .results { display: grid; gap: 14px; }
    .program { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
               padding: 16px 18px; box-shadow: var(--shadow); }
    .program h2 { font-family: var(--display); font-size: 20px; font-weight: 600;
                  margin: 0 0 4px; line-height: 1.2; }
    .agency { color: var(--ink-soft); font-size: 14px; margin: 0 0 10px; }
    .desc { margin: 0 0 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
    .tag { font-size: 12px; padding: 3px 9px; border-radius: 999px;
           border: 1px solid var(--line); color: var(--ink-soft); background: var(--paper); }
    .tag.level { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); color: var(--accent); }
    .tag.open { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); color: var(--good); }
    .tag.unknown { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); color: var(--warn); }
    .tag.overlay { border-color: color-mix(in srgb, var(--accent-warm) 45%, var(--line)); color: var(--accent-warm); }
    /* The location caveat. Deliberately prominent: being inside a boundary is not qualifying. */
    .caveat { font-size: 13px; color: var(--warn); margin: 0 0 10px; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px;
            color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 10px; }
    .empty { background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius);
             padding: 34px; text-align: center; color: var(--ink-soft); }
    footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
             font-size: 13px; color: var(--ink-soft); }
    /* Visible only to screen readers — used for the live result announcement. */
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="index.html">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
          <path d="M12 4l2.4 5.6L20 12l-5.6 2.4L12 20l-2.4-5.6L4 12l5.6-2.4z" fill="var(--accent-warm)"/>
        </svg>
        NYC Compass
      </a>

      <h1>Find funding</h1>
      <p class="lede">Every government funding programme and tax incentive in this prototype, with
      a source link and the date that source was last checked. Filter by who you are, what you need,
      and which level of government runs it.</p>

      <div class="banner">
        <span aria-hidden="true">⚠️</span>
        <!-- Injected from data/programs.json so this cannot drift from config.NOT_ADVICE_NOTICE. -->
        <span id="notice"></span>
      </div>
    </header>

    <!-- Real form controls throughout: a <select> is keyboard-navigable and screen-reader
         announced for free, where a styled <div> would need all of that rebuilding badly. -->
    <form class="filters" id="filters" role="search" aria-label="Filter funding programmes">
      <div class="filter-grid">
        <div class="field wide">
          <label for="q">Search</label>
          <input type="search" id="q" placeholder="e.g. grocery, solar, tax credit">
        </div>
        <div class="field">
          <label for="level">Level of government</label>
          <select id="level"><option value="">Any</option></select>
        </div>
        <div class="field">
          <label for="assistance">Kind of help</label>
          <select id="assistance"><option value="">Any</option></select>
        </div>
        <div class="field">
          <label for="org">I am a</label>
          <select id="org"><option value="">Anyone</option></select>
        </div>
        <div class="field">
          <label for="industry">Industry</label>
          <select id="industry"><option value="">Any</option></select>
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status"><option value="">Any</option></select>
        </div>
      </div>
      <div class="filter-actions">
        <p class="count" id="count" aria-hidden="true"></p>
        <button type="button" class="reset" id="clear-filters">Clear filters</button>
      </div>
      <!-- Announced to screen readers when the result count changes, so filtering is not a
           silent event for someone who cannot see the list shift. -->
      <p class="sr-only" role="status" aria-live="polite" id="live"></p>
    </form>

    <main class="results" id="results"></main>

    <footer>
      <p id="attribution"></p>
      <p><a href="map.html">Map a specific address →</a> &nbsp;·&nbsp;
         <a href="index.html">About this prototype →</a></p>
    </footer>
  </div>

<script>
  // ==========================================================================
  // All of the behaviour. No framework, no build step — one static file and a fetch.
  // At ~100 programs there is nothing here that needs to be cleverer than this.
  // ==========================================================================

  /** Escape text before putting it in HTML. Program names and agency names come from government
   *  pages, and a stray < or & would otherwise break the markup or inject something. */
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /** Turn a machine value into something a person reads. `tax-credit` -> `tax credit`. */
  const human = (s) => String(s ?? "").replace(/[-_]/g, " ");

  /** How a status should be SHOWN, which is not the same as what it is.
   *  `unknown` becomes "check current status" rather than a bare "unknown", because the honest
   *  message to a reader is an instruction, not an absence. It must never render as "open". */
  function statusLabel(status) {
    if (status === "open") return { text: "Open now", cls: "open" };
    if (status === "rolling") return { text: "Rolling / always open", cls: "open" };
    return { text: "Check current status", cls: "unknown" };
  }

  let DATA = { programs: [], facets: {} };

  /** Fill a <select> from the values that actually occur in the data. */
  function fillSelect(id, values, transform = human) {
    const el = document.getElementById(id);
    for (const value of values) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = transform(value);
      el.appendChild(option);
    }
  }

  function currentFilters() {
    return {
      q: document.getElementById("q").value.trim().toLowerCase(),
      level: document.getElementById("level").value,
      assistance: document.getElementById("assistance").value,
      org: document.getElementById("org").value,
      industry: document.getElementById("industry").value,
      status: document.getElementById("status").value,
    };
  }

  function matches(program, f) {
    if (f.level && program.government_level !== f.level) return false;
    if (f.status && program.status !== f.status) return false;
    if (f.assistance && !(program.assistance_type || []).includes(f.assistance)) return false;
    // "Anyone" is a real answer for some programs, so a reader filtering to "non-profit" should
    // still see programmes open to everyone rather than having them hidden.
    if (f.org && !(program.org_types || []).includes(f.org)) return false;
    if (f.industry) {
      const industries = program.industries || [];
      if (!industries.includes(f.industry) && !industries.includes("any")) return false;
    }
    if (f.q) {
      const haystack = [
        program.program_name, program.agency, program.short_description,
        program.eligibility_summary, (program.assistance_type || []).join(" "),
        (program.industries || []).join(" "),
      ].join(" ").toLowerCase();
      if (!haystack.includes(f.q)) return false;
    }
    return true;
  }

  function programCard(p) {
    const status = statusLabel(p.status);
    const tags = [
      `<span class="tag level">${esc(human(p.government_level))}</span>`,
      `<span class="tag ${status.cls}">${esc(status.text)}</span>`,
      ...(p.assistance_type || []).map((a) => `<span class="tag">${esc(human(a))}</span>`),
      p.related_overlay ? `<span class="tag overlay">tied to a map area</span>` : "",
    ].join("");

    // The location caveat. Shown for every place-based programme, because falling inside a
    // boundary is not the same as qualifying — and a reader cannot be expected to know that.
    const caveat = p.place_based
      ? `<p class="caveat">Limited to specific locations. Check whether your address is inside
         the eligible area — being nearby is not the same as qualifying.</p>`
      : "";

    return `
      <article class="program" id="${esc(p.slug)}">
        <h2>${esc(p.program_name)}</h2>
        <p class="agency">${esc(p.agency || "")}</p>
        <div class="tags">${tags}</div>
        <p class="desc">${esc(p.short_description || "")}</p>
        ${caveat}
        <div class="meta">
          <span><a href="${esc(p.official_url)}" rel="noopener noreferrer" target="_blank">Official page ↗</a></span>
          <span>Source checked ${esc(p.source_verified_date || "unknown")}</span>
          ${p.hand_verified ? "<span>Checked by a person</span>" : ""}
        </div>
      </article>`;
  }

  function render() {
    const f = currentFilters();
    const shown = DATA.programs.filter((p) => matches(p, f));
    const total = DATA.programs.length;

    const results = document.getElementById("results");
    results.innerHTML = shown.length
      ? shown.map(programCard).join("")
      : `<p class="empty">No programmes match those filters. Try clearing one —
         this prototype holds ${total} programmes, not every programme that exists.</p>`;

    // Say the denominator, always. "12 programmes" invites being read as "all of them".
    const text = shown.length === total
      ? `${total} programmes`
      : `${shown.length} of ${total} programmes`;
    document.getElementById("count").innerHTML =
      `${esc(text)} <span class="dim">— every one cited</span>`;
    document.getElementById("live").textContent = `${text} shown.`;
  }

  async function start() {
    const response = await fetch("data/programs.json");
    DATA = await response.json();

    document.getElementById("notice").textContent = DATA.not_advice_notice || "";
    document.getElementById("attribution").textContent = DATA.attribution || "";

    fillSelect("level", DATA.facets.government_level || []);
    fillSelect("assistance", DATA.facets.assistance_type || []);
    fillSelect("org", DATA.facets.org_types || []);
    fillSelect("industry", DATA.facets.industries || []);
    fillSelect("status", DATA.facets.status || [], (s) => statusLabel(s).text);

    document.getElementById("filters").addEventListener("input", render);
    // NOTE the button's id is "clear-filters", NOT "reset". A form control's id becomes a
    // property on its form element, so id="reset" would shadow HTMLFormElement.prototype.reset
    // and `form.reset()` would throw "reset is not a function". It fails at runtime only, with a
    // console error nobody sees, leaving a button that silently does nothing. Caught by a UI test.
    document.getElementById("clear-filters").addEventListener("click", () => {
      document.getElementById("filters").reset();
      render();
    });
    render();

    // If the page was opened with a #slug, scroll to that programme. This is what makes a link to
    // one programme work — the thing an immutable slug exists for.
    if (location.hash) {
      const target = document.getElementById(location.hash.slice(1));
      if (target) target.scrollIntoView({ block: "center" });
    }
  }

  start();
</script>
</body>
</html>
